<script>
// Called by the app whenever the surface changes.
window.__acTheme = function (light, bg) {
  try { localStorage.setItem("ascend:ui_light", light ? "1" : "0"); } catch (e) {}
  var m = document.querySelector('meta[name="theme-color"]');
  if (m && bg) m.setAttribute("content", bg);
  if (bg) document.documentElement.style.background = document.body.style.background = bg;
};

// A Home Screen app can sit suspended overnight. If it comes back on a new day,
// reload so Today, streaks and the day counter move forward.
(function () {
  function key() { var d = new Date(); return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate(); }
  var day = key();
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "visible" || key() === day) return;
    var a = document.activeElement;
    if (a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA")) return;
    location.reload();
  });
})();
</script>

<script>
(function () {
  var sp = document.getElementById("splash"), root = document.getElementById("root"), gone = false;
  if (!sp) return;
  // Fade out once, after the app has painted its first frame underneath, so the loading
  // screen hands over in a single dissolve instead of cutting away.
  function hide() {
    if (gone) return; gone = true;
    requestAnimationFrame(function () { requestAnimationFrame(function () {
      setTimeout(function () { sp.classList.add("done"); setTimeout(function () { sp.remove(); }, 600); }, Math.max(0, 700 - performance.now()));
    }); });
  }
  if (root.querySelector(".ac-root")) hide();
  else new MutationObserver(function (m, o) { if (root.querySelector(".ac-root")) { o.disconnect(); hide(); } }).observe(root, { childList: true, subtree: true });
  setTimeout(hide, 6000);
})();
</script>
<script>
// Warm the artwork once the app has drawn, so the Everyday tiles paint straight away.
(function () {
  var names = ["h-weight", "h-sleep", "h-caf", "h-cal", "timer", "focus", "deep", "meditate", "breathe", "todo", "goals", "books", "train", "shifts", "deadlines", "food-breakfast", "food-lunch", "food-dinner", "food-prep", "food-snack", "food-mine"], keep = [];
  function warm() {
    names.forEach(function (n) {
      var img = new Image(); img.decoding = "async"; img.src = "art/" + n + ".jpg"; keep.push(img);
      if (img.decode) img.decode().catch(function () {});
    });
    window.__acArt = keep;
  }
  var go = function () { (window.requestIdleCallback || function (f) { setTimeout(f, 300); })(warm, { timeout: 1200 }); };
  document.readyState === "complete" ? go() : addEventListener("load", go);
})();
// The service worker serves the app network-first, so this launch already runs the newest
// files. It is not reloaded when a new worker takes over: that reload is what made the
// loading screen and Today flash back and forth after every deploy and on first install.
if ("serviceWorker" in navigator) {
  addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").then(function (reg) {
      reg.update();
      setInterval(function () { reg.update(); }, 3600000);
    }).catch(function () {});
  });
}
</script>
