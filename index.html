<div id="root"><div id="boot"><div class="b-mark">⟡</div><div class="b-line">Advanced nurturing, one day at a time.</div></div></div>
<script>
// Called by the app whenever the surface changes.
window.__acTheme = function (light, bg) {
  try { localStorage.setItem("ascend:ui_light", light ? "1" : "0"); } catch (e) {}
  var m = document.querySelector('meta[name="theme-color"]');
  if (m && bg) m.setAttribute("content", bg);
  if (bg) document.documentElement.style.background = document.body.style.background = bg;
};

// A Home Screen app can sit suspended overnight. If it comes back on a new day,
// reload so Today, streaks and the day counter move forward.
(function () {
  function key() { var d = new Date(); return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate(); }
  var day = key();
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "visible" || key() === day) return;
    var a = document.activeElement;
    if (a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA")) return;
    location.reload();
  });
})();
</script>

<script>
// Warm the artwork once the app has drawn, so the Everyday tiles paint straight away.
(function () {
  var names = ["timer", "focus", "deep", "meditate", "breathe", "todo", "goals", "books", "train", "shifts", "deadlines", "food-breakfast", "food-lunch", "food-dinner", "food-prep", "food-snack", "food-mine"], keep = [];
  function warm() {
    names.forEach(function (n) {
      var img = new Image(); img.decoding = "async"; img.src = "art/" + n + ".jpg"; keep.push(img);
      if (img.decode) img.decode().catch(function () {});
    });
    window.__acArt = keep;
  }
  var go = function () { (window.requestIdleCallback || function (f) { setTimeout(f, 300); })(warm, { timeout: 1200 }); };
  document.readyState === "complete" ? go() : addEventListener("load", go);
})();
if ("serviceWorker" in navigator) {
  var reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", function () {
    if (reloading) return; reloading = true; location.reload();
  });
  addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").then(function (reg) {
      reg.update();
      setInterval(function () { reg.update(); }, 3600000);
    }).catch(function () {});
  });
}
</script>
